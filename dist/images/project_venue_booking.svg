<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <rect width="1200" height="675" fill="#f4f4f5"/>
  <!-- App Frame -->
  <rect x="60" y="45" width="1080" height="585" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <!-- Top Bar -->
  <rect x="60" y="45" width="1080" height="50" fill="#09090b"/>
  <text x="95" y="76" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">TANAH GROGOT SPORTS &amp; VENUE RESERVATION</text>
  <text x="980" y="75" font-family="JetBrains Mono, monospace" font-size="12" fill="#a1a1aa">Gov Agency Portal</text>
  
  <!-- Hero Section inside mock -->
  <rect x="100" y="120" width="1000" height="120" rx="6" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="130" y="160" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="800" fill="#09090b">Book Sports Fields &amp; Event Facilities Online</text>
  <text x="130" y="190" font-family="Plus Jakarta Sans, sans-serif" font-size="14" fill="#52525b">Real-time venue availability calendar for GOR Tanah Grogot &amp; public halls.</text>

  <!-- Calendar Grid -->
  <text x="100" y="275" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" fill="#09090b">Select Date &amp; Field Time Slot</text>
  
  <!-- Calendar Grid Box -->
  <rect x="100" y="295" width="600" height="300" rx="6" fill="#ffffff" stroke="#d4d4d8"/>
  <rect x="100" y="295" width="600" height="40" fill="#f4f4f5"/>
  <text x="120" y="320" font-family="JetBrains Mono, monospace" font-size="13" font-weight="bold" fill="#09090b">JULY 2026 SCHEDULE</text>
  
  <!-- Slots -->
  <rect x="120" y="350" width="160" height="50" rx="4" fill="#09090b"/>
  <text x="140" y="372" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" fill="#ffffff">08:00 - 10:00 AM</text>
  <text x="140" y="390" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#a1a1aa">LOCKED / RESERVED</text>

  <rect x="300" y="350" width="160" height="50" rx="4" fill="#ffffff" stroke="#09090b" stroke-width="2"/>
  <text x="320" y="372" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" fill="#09090b">10:00 - 12:00 PM</text>
  <text x="320" y="390" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="bold" fill="#09090b">AVAILABLE SLOT</text>

  <rect x="480" y="350" width="160" height="50" rx="4" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="500" y="372" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" fill="#52525b">02:00 - 04:00 PM</text>
  <text x="500" y="390" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#71717a">AVAILABLE SLOT</text>

  <rect x="120" y="420" width="160" height="50" rx="4" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="140" y="442" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" fill="#52525b">04:00 - 06:00 PM</text>
  <text x="140" y="460" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#71717a">AVAILABLE SLOT</text>

  <rect x="300" y="420" width="160" height="50" rx="4" fill="#09090b"/>
  <text x="320" y="442" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" fill="#ffffff">07:00 - 09:00 PM</text>
  <text x="320" y="460" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#a1a1aa">LOCKED / RESERVED</text>

  <!-- Right Form Side -->
  <rect x="730" y="295" width="370" height="300" rx="6" fill="#fafafa" stroke="#d4d4d8"/>
  <text x="755" y="330" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="bold" fill="#09090b">Reservation Checkout</text>
  <text x="755" y="360" font-family="JetBrains Mono, monospace" font-size="11" fill="#71717a">SELECTED FACILITY</text>
  <text x="755" y="380" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" fill="#09090b">Lapangan Futsal GOR Utama</text>

  <line x1="755" y1="400" x2="1075" y2="400" stroke="#e4e4e7"/>

  <text x="755" y="430" font-family="JetBrains Mono, monospace" font-size="11" fill="#71717a">TIME SLOT</text>
  <text x="755" y="450" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="bold" fill="#09090b">Today, 10:00 - 12:00 PM (2 Hours)</text>

  <rect x="755" y="500" width="320" height="45" rx="4" fill="#09090b"/>
  <text x="830" y="527" font-family="JetBrains Mono, monospace" font-size="13" font-weight="bold" fill="#ffffff">CONFIRM RESERVATION</text>
</svg>
