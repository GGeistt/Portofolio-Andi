<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <rect width="1200" height="675" fill="#f4f4f5"/>
  <!-- App Frame -->
  <rect x="60" y="45" width="1080" height="585" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <!-- Top Bar -->
  <rect x="60" y="45" width="1080" height="50" fill="#18181b"/>
  <text x="95" y="76" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="extrabold" fill="#ffffff">DINAS LINGKUNGAN HIDUP KABUPATEN BULUNGAN — LOGISTICS</text>
  <text x="960" y="75" font-family="JetBrains Mono, monospace" font-size="12" fill="#a1a1aa">Fleet Dispatch Portal</text>
  
  <!-- Content Header -->
  <text x="100" y="140" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800" fill="#09090b">Waste Transportation Fleet &amp; Route Logistics</text>

  <!-- Metric Badges -->
  <rect x="100" y="165" width="240" height="75" rx="4" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="120" y="190" font-family="JetBrains Mono, monospace" font-size="11" fill="#71717a">ACTIVE TRUCK FLEET</text>
  <text x="120" y="220" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800" fill="#09090b">24 Trucks Dispatched</text>

  <rect x="360" y="165" width="240" height="75" rx="4" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="380" y="190" font-family="JetBrains Mono, monospace" font-size="11" fill="#71717a">TODAY'S DISPOSAL TONNAGE</text>
  <text x="380" y="220" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="800" fill="#09090b">148.5 Tons</text>

  <rect x="620" y="165" width="480" height="75" rx="4" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="640" y="190" font-family="JetBrains Mono, monospace" font-size="11" fill="#71717a">REGENCY SECTORS COVERED</text>
  <text x="640" y="220" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700" fill="#09090b">Tanjung Selor, Sekatak, Peso &amp; Tanjung Palas</text>

  <!-- Route Dispatch Table Header -->
  <rect x="100" y="265" width="1000" height="40" fill="#09090b"/>
  <text x="120" y="290" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" fill="#ffffff">FLEET ID</text>
  <text x="240" y="290" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" fill="#ffffff">DRIVER &amp; VEHICLE</text>
  <text x="480" y="290" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" fill="#ffffff">ASSIGNED SECTOR ROUTE</text>
  <text x="760" y="290" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" fill="#ffffff">TONNAGE LOGGED</text>
  <text x="960" y="290" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" fill="#ffffff">DISPATCH STATUS</text>

  <!-- Table Rows -->
  <rect x="100" y="305" width="1000" height="50" fill="#ffffff"/>
  <line x1="100" y1="355" x2="1100" y2="355" stroke="#e4e4e7"/>
  <text x="120" y="335" font-family="JetBrains Mono, monospace" font-size="12" fill="#52525b">TRK-01</text>
  <text x="240" y="335" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="bold" fill="#09090b">Bambang S. (KU 8124 A)</text>
  <text x="480" y="335" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#09090b">Sector A — Pasar Sore &amp; Jend. Sudirman</text>
  <text x="760" y="335" font-family="JetBrains Mono, monospace" font-size="12" fill="#09090b">6.4 Tons</text>
  <text x="960" y="335" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" fill="#16a34a">COMPLETED</text>

  <rect x="100" y="355" width="1000" height="50" fill="#fafafa"/>
  <line x1="100" y1="405" x2="1100" y2="405" stroke="#e4e4e7"/>
  <text x="120" y="385" font-family="JetBrains Mono, monospace" font-size="12" fill="#52525b">TRK-02</text>
  <text x="240" y="385" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="bold" fill="#09090b">Hasanuddin (KU 8125 A)</text>
  <text x="480" y="385" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#09090b">Sector B — Sabanar Lama &amp; Permata</text>
  <text x="760" y="385" font-family="JetBrains Mono, monospace" font-size="12" fill="#09090b">7.8 Tons</text>
  <text x="960" y="385" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" fill="#16a34a">COMPLETED</text>

  <rect x="100" y="405" width="1000" height="50" fill="#ffffff"/>
  <line x1="100" y1="455" x2="1100" y2="455" stroke="#e4e4e7"/>
  <text x="120" y="435" font-family="JetBrains Mono, monospace" font-size="12" fill="#52525b">TRK-03</text>
  <text x="240" y="435" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="bold" fill="#09090b">Supriadi (KU 8128 A)</text>
  <text x="480" y="435" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#09090b">Sector C — Tanjung Selor Timur</text>
  <text x="760" y="435" font-family="JetBrains Mono, monospace" font-size="12" fill="#09090b">5.2 Tons</text>
  <text x="960" y="435" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" fill="#16a34a">COMPLETED</text>
